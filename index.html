<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FocusFlow — Task Manager</title>
  <meta name="description" content="A minimalist personal task manager. Organise tasks by priority, category, and due date." />

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />

  <!-- Theme script runs before paint to prevent flash -->
  <script>
    (function() {
      const saved = localStorage.getItem('ff-theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (saved === 'dark' || (!saved && prefersDark)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>

  <!-- ── App Shell ── -->
  <div class="app">

    <!-- ── Header ── -->
    <header class="app-header">
      <div class="app-header__inner">
        <div class="app-header__brand">
          <h1 class="app-header__title">FocusFlow</h1>
          <p class="app-header__subtitle">Stay focused, get things done.</p>
        </div>
        <button id="theme-toggle" class="btn-icon" aria-label="Toggle theme" title="Toggle light/dark mode">
          <!-- Moon (shown in light mode) -->
          <svg class="icon-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <!-- Sun (shown in dark mode) -->
          <svg class="icon-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </header>

    <!-- ── Main content ── -->
    <main class="app-main">
      <div class="container">

        <!-- ── Stats bar ── -->
        <!--
          Shows a live summary: total tasks, completed, remaining.
          JavaScript will update these numbers whenever tasks change.
        -->
        <div class="stats-bar" role="status" aria-live="polite" aria-label="Task summary">
          <div class="stat">
            <span class="stat__number" id="stat-total">0</span>
            <span class="stat__label">Total</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat__number" id="stat-active">0</span>
            <span class="stat__label">Active</span>
          </div>
          <div class="stat-divider"></div>
          <div class="stat">
            <span class="stat__number" id="stat-done">0</span>
            <span class="stat__label">Completed</span>
          </div>
        </div>

        <!-- ── Add task form ── -->
        <!--
          novalidate: we handle validation ourselves in JS (gives us control
          over error messages and styling).
          The form has four fields: title (required), priority, category, due date.
        -->
        <section class="card" aria-label="Add a new task">
          <h2 class="card__heading">Add a task</h2>

          <form id="task-form" class="task-form" novalidate>

            <!-- Title field (required) -->
            <div class="form-group form-group--wide">
              <label for="task-title" class="form-label">Task <span class="required" aria-hidden="true">*</span></label>
              <input
                type="text"
                id="task-title"
                name="title"
                class="form-input"
                placeholder="What needs to be done?"
                maxlength="120"
                autocomplete="off"
                aria-required="true"
              />
              <!-- Error message shown when user submits a blank task -->
              <p class="form-error" id="title-error" role="alert" aria-live="polite"></p>
            </div>

            <!-- Priority select -->
            <div class="form-group">
              <label for="task-priority" class="form-label">Priority</label>
              <select id="task-priority" name="priority" class="form-select">
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="low">Low</option>
              </select>
            </div>

            <!-- Category input -->
            <div class="form-group">
              <label for="task-category" class="form-label">Category</label>
              <input
                type="text"
                id="task-category"
                name="category"
                class="form-input"
                placeholder="e.g. Study, Personal"
                maxlength="40"
                autocomplete="off"
              />
            </div>

            <!-- Due date -->
            <div class="form-group">
              <label for="task-due" class="form-label">Due date</label>
              <input
                type="date"
                id="task-due"
                name="due"
                class="form-input"
              />
            </div>

            <!-- Submit button -->
            <div class="form-group form-group--wide form-group--actions">
              <button type="submit" class="btn btn--primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
                Add Task
              </button>
            </div>

          </form>
        </section>

        <!-- ── Filters & sort ── -->
        <div class="toolbar">

          <!-- Filter by status -->
          <div class="filter-group" role="group" aria-label="Filter tasks by status">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
          </div>

          <!-- Filter by priority -->
          <div class="filter-group" role="group" aria-label="Filter tasks by priority">
            <button class="filter-btn" data-priority="all">Any priority</button>
            <button class="filter-btn" data-priority="high">High</button>
            <button class="filter-btn" data-priority="medium">Medium</button>
            <button class="filter-btn" data-priority="low">Low</button>
          </div>

          <!-- Sort -->
          <div class="sort-group">
            <label for="sort-select" class="form-label">Sort by</label>
            <select id="sort-select" class="form-select form-select--sm">
              <option value="created-desc">Newest first</option>
              <option value="created-asc">Oldest first</option>
              <option value="due-asc">Due date (soonest)</option>
              <option value="priority-desc">Priority (high → low)</option>
            </select>
          </div>

          <!-- Clear completed button -->
          <button id="clear-completed" class="btn btn--ghost btn--sm">
            Clear completed
          </button>

        </div>

        <!-- ── Task list ── -->
        <!--
          aria-label and role="list" make this accessible to screen readers.
          JavaScript will inject <li> elements here for each task.
        -->
        <section aria-label="Task list">
          <ul id="task-list" class="task-list" role="list" aria-label="Tasks">
            <!-- Tasks are injected here by JavaScript -->
          </ul>

          <!-- Empty state — shown when no tasks match the current filter -->
          <div id="empty-state" class="empty-state" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
            <p class="empty-state__message" id="empty-message">No tasks yet. Add one above to get started.</p>
          </div>
        </section>

      </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="app-footer">
      <p>FocusFlow · Built by Muhammad Nihal · <a href="https://nihalpulikkal.github.io" target="_blank" rel="noopener noreferrer">Portfolio</a></p>
    </footer>

  </div><!-- /app -->

  <script src="js/app.js"></script>
</body>
</html>
